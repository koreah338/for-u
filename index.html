<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special For You</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: #f7f4e9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Background Aesthetic Shapes (Hiasan Latar) */
        .bg-shape {
            position: absolute;
            z-index: 0;
            opacity: 0.6;
        }

        /* Container Utama */
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        /* Desain Buku Catatan */
        .notebook {
            background: #fff;
            width: 320px;
            height: 440px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            position: relative;
            padding: 40px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #e0e0e0;
        }

        /* Spiral Buku di Bagian Atas */
        .spiral-container {
            position: absolute;
            top: -12px;
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between;
        }

        .spiral-ring {
            width: 10px;
            height: 25px;
            background: #222;
            border-radius: 5px;
        }

        /* Efek Garis Buku Catatan */
        .notebook-lines {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 60px;
            left: 0;
            padding: 0 20px;
            background-image: linear-gradient(#e5e5e5 1px, transparent 1px);
            background-size: 100% 30px;
            pointer-events: none;
        }

        /* Halaman / Slides */
        .page {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .page.active {
            display: flex;
        }

        /* Konten Gambar/Stiker & Teks */
        .sticker {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .title-text {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            margin-top: 20px;
        }

        .message-text {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            text-align: left;
            width: 100%;
            padding-left: 10px;
            line-height: 30px; /* Menyesuaikan dengan jarak garis buku */
            margin-top: 5px;
        }

        /* Tombol Navigasi */
        .btn {
            background-color: #ffb6c1;
            border: 2px solid #333;
            padding: 8px 25px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 0 #333;
            transition: all 0.1s ease;
            margin-top: 25px;
            z-index: 10;
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #333;
        }

        /* Modal Pop-up Tulis Pesan */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #fdfbf7;
            padding: 25px;
            border-radius: 15px;
            width: 85%;
            max-width: 320px;
            border: 2px solid #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        .modal-content h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .modal-content textarea {
            width: 100%;
            height: 100px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            resize: none;
            outline: none;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="notebook">
            <!-- Lingkaran Spiral Atas -->
            <div class="spiral-container">
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
            </div>

            <!-- Garis Buku -->
            <div class="notebook-lines"></div>

            <!-- HALAMAN 1 (Home) -->
            <div class="page active" id="page-1">
                <h2 class="title-text" style="margin-top: 40px;">Special For You</h2>
                <img src="https://i.ibb.co.com/8451q9v/bear-book.png" alt="Bear Reading" class="sticker" style="width: 130px; height: 130px; margin-top: 20px;">
                <button class="btn" onclick="nextPage()">Klik Disini</button>
            </div>

            <!-- HALAMAN 2 -->
            <div class="page" id="page-2">
                <img src="https://i.ibb.co.com/6J26j15/cute-bear1.png" alt="Sticker" class="sticker">
                <div class="message-text">Hallo Sayangku..</div>
                <button class="btn" onclick="nextPage()">Lanjut</button>
            </div>

            <!-- HALAMAN 3 -->
            <div class="page" id="page-3">
                <img src="https://i.ibb.co.com/6J26j15/cute-bear1.png" alt="Sticker" class="sticker">
                <div class="message-text">Hari ini gimana?</div>
                <div class="message-text">Apa kamu baik-baik aja?</div>
                <button class="btn" onclick="nextPage()">Lanjut</button>
            </div>

            <!-- HALAMAN 4 -->
            <div class="page" id="page-4">
                <img src="https://i.ibb.co.com/6J26j15/cute-bear1.png" alt="Sticker" class="sticker">
                <div class="message-text">Kalo ada sesuatu cerita aja yaa, ada aku disini...</div>
                <button class="btn" onclick="nextPage()">Lanjut</button>
            </div>

            <!-- HALAMAN 5 (Akhir) -->
            <div class="page" id="page-5">
                <img src="https://i.ibb.co.com/6J26j15/cute-bear1.png" alt="Sticker" class="sticker">
                <div class="message-text">I love you sayang...</div>
                <button class="btn" onclick="openModal()">Kirim Pesan</button>
            </div>
        </div>
    </div>

    <!-- POPUP MODAL KETIK PESAN -->
    <div class="modal" id="messageModal">
        <div class="modal-content">
            <h3>Tulis pesan</h3>
            <textarea id="userMessage" placeholder="Tulis balasan atau pesanmu di sini..."></textarea>
            <button class="btn" style="margin-top: 0;" onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const totalPages = 5;

        function nextPage() {
            document.getElementById(`page-${currentPage}`).classList.remove('active');
            currentPage++;
            if (currentPage > totalPages) {
                currentPage = 1; // Kembali ke awal atau sesuaikan
            }
            document.getElementById(`page-${currentPage}`).classList.add('active');
        }

        function openModal() {
            document.getElementById('messageModal').style.display = 'flex';
        }

        function sendMessage() {
            let msg = document.getElementById('userMessage').value;
            if(msg.trim() === "") {
                alert("Pesan tidak boleh kosong!");
                return;
            }
            alert("Pesan berhasil terkirim!");
            document.getElementById('messageModal').style.display = 'none';
            document.getElementById('userMessage').value = "";
        }
    </script>
</body>
</html>
